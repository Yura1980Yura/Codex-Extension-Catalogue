name: Catalogue checks
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -X utf8 -B setup.py --verify-only
      - run: python -X utf8 -B -m unittest discover -s tests -p test_deployment.py
      - if: runner.os == 'Windows'
        run: python -X utf8 -B -m unittest discover -s tests
      - if: runner.os == 'Windows'
        run: python -X utf8 -B -m unittest discover -s preview/tests
      - run: python -X utf8 -B scripts/build_distribution.py
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - run: npm ci
      - run: npm test
